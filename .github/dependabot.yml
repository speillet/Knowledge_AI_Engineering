# Group and monthly updates, to limit the noise of PR.
# examples/agentic-support is excluded: its versions are locked and checked by hand
# (see its requirements.txt).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: [/, /scripts]
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
