name: Lint des flashcards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les fiches
        run: python3 scripts/lint_flashcards.py --stale-months 0
