name: Validation des flashcards et export Anki

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt
      - name: Vérifier les fiches
        run: python3 scripts/lint_flashcards.py --stale-months 0
      - name: Vérifier les sommaires générés
        run: python3 scripts/sync_catalog.py --check
      - name: Tester les scripts et le paquet Anki
        run: python3 -m unittest discover -s tests -v
      - name: Générer le paquet Anki
        run: python3 scripts/export_anki.py
      - name: Conserver le paquet pour validation
        uses: actions/upload-artifact@v4
        with:
          name: ai-engineering-anki
          path: dist/ai-engineering.apkg
          if-no-files-found: error
