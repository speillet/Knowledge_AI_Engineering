name: Flashcards and Anki export

# Checks run on every PR and push. Publish the anki release from main only after they pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10: minimum version supported; 3.12: version that produces the published package.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/requirements.txt
      - name: Install dependencies
        run: make install
      - name: Check topics, catalogs, code, tests and workshops
        run: make check
      - name: Build the Anki package
        if: matrix.python-version == '3.12'
        run: make export
      - name: Save the package for validation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ai-engineering-anki
          path: dist/ai-engineering.apkg
          if-no-files-found: error

  publish:
    name: Publish the anki release
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: anki-export
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ai-engineering-anki
          path: dist
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view anki >/dev/null 2>&1; then
            gh release create anki --title "Anki package" --latest=false \
              --notes "Anki package for the vault, rebuilt on every push to main. See the “Review on Android with Anki” section of the README."
          fi
          gh release upload anki dist/ai-engineering.apkg --clobber
