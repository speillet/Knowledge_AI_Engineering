name: Flashcards and Anki export

# Checks run on every PR and push. Only after they pass, publish the rolling anki release
# from main, and a versioned release for each pull request merged into main or for an
# anki-v* tag pushed on a commit of main.
on:
  push:
    branches: [main]
    tags: ["anki-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10: minimum version supported; 3.12: version that produces the published package.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/requirements.txt
      - name: Install dependencies
        run: make install
      - name: Check topics, catalogs, code, tests and workshops
        run: make check
      - name: Build the Anki package
        if: matrix.python-version == '3.12'
        run: make export
      - name: Save the package for validation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ai-engineering-anki
          path: dist/ai-engineering.apkg
          if-no-files-found: error

  publish:
    name: Publish the anki release
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: anki-export
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ai-engineering-anki
          path: dist
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view anki >/dev/null 2>&1; then
            gh release create anki --title "Anki package" --latest=false \
              --notes "Anki package for the vault, rebuilt after checks pass on main. See the Anki guide linked from the README."
          fi
          gh release upload anki dist/ai-engineering.apkg --clobber

  release:
    name: Publish the versioned release
    needs: check
    # A pull request merged into main gets the next free tag of the day: anki-vYYYY.MM.DD,
    # then .2, .3… An anki-v* tag pushed by hand on a commit of main is published as is.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/anki-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: anki-release-${{ github.sha }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, to find a release already made for this commit.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ai-engineering-anki
          path: dist
      - name: Choose the release
        id: choose
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
            if [ "$status" != identical ] && [ "$status" != behind ]; then
              echo "::error::$GITHUB_REF_NAME must point to a commit of main (compare status: $status)."
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A commit of main that already carries a release tag keeps that release: a rerun
          # refreshes its package, and a tag pushed by hand is published by its own run.
          tagged=$(git tag --points-at "$GITHUB_SHA" --list 'anki-v*' | head -n 1)
          if [ -n "$tagged" ]; then
            if gh release view "$tagged" >/dev/null 2>&1; then
              echo "tag=$tagged" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::$tagged is published by the run of its tag."
            fi
            exit 0
          fi
          pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::${GITHUB_SHA::7} does not merge a pull request: no versioned release."
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Publish the package with generated notes
        if: steps.choose.outputs.tag != '' || steps.choose.outputs.pr != ''
        env:
          TAG: ${{ steps.choose.outputs.tag }}
          PR: ${{ steps.choose.outputs.pr }}
        run: |
          # A rerun only refreshes the package; published notes are left as they are.
          if [ -n "$TAG" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ai-engineering.apkg --clobber
            exit 0
          fi
          stats=$(python3 scripts/lint_flashcards.py --quiet | tail -n 1 | sed 's/ —.*//')
          previous=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("anki-v"))] | sort_by(.created_at) | last | .tag_name // empty')
          for attempt in 1 2 3 4 5; do
            create=(--verify-tag)
            source="commit ${GITHUB_SHA::7}"
            if [ -n "$PR" ]; then
              # Highest release number of the day among anki-vYYYY.MM.DD (1) and its .N tags.
              day=$(date -u +%Y.%m.%d)
              last=$(gh api "repos/$GH_REPO/git/matching-refs/tags/anki-v$day" --jq "[.[].ref
                | ltrimstr(\"refs/tags/anki-v$day\") | select(. == \"\" or test(\"^[.][0-9]+$\"))
                | if . == \"\" then 1 else ltrimstr(\".\") | tonumber end] | max // 0")
              TAG="anki-v$day"
              if [ "$last" -gt 0 ]; then TAG="anki-v$day.$((last + 1))"; fi
              create=(--target "$GITHUB_SHA")
              source="$source, pull request #$PR"
            fi
            args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
            if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
            {
              echo "Anki package of the vault at \`$TAG\` ($source): $stats."
              echo
              echo "Import \`ai-engineering.apkg\` into Anki or AnkiDroid: reimporting updates existing notes and keeps their review history. The [stable link](https://github.com/$GH_REPO/releases/download/anki/ai-engineering.apkg) always serves the latest build of \`main\`."
              echo
              gh api "repos/$GH_REPO/releases/generate-notes" "${args[@]}" --jq .body
            } > notes.md
            if gh release create "$TAG" dist/ai-engineering.apkg "${create[@]}" --latest \
              --title "Anki package ${TAG#anki-v}" --notes-file notes.md; then
              exit 0
            fi
            # Only a tag taken meanwhile by another merge of the day is worth another try.
            if [ -z "$PR" ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          exit 1
