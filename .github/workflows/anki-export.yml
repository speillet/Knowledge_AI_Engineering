name: Export Anki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anki-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt
      - name: Vérifier les fiches
        run: python3 scripts/lint_flashcards.py --quiet --stale-months 0
      - name: Générer le paquet Anki
        run: python3 scripts/export_anki.py
      - name: Publier dans la release « anki »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view anki >/dev/null 2>&1; then
            gh release create anki --title "Paquet Anki" --latest=false \
              --notes "Paquet Anki du vault, régénéré à chaque push sur main. Voir la section « Réviser sur Android avec Anki » du README."
          fi
          gh release upload anki dist/ai-engineering.apkg --clobber
