name: Atelier agentique local

on:
  push:
    branches: [main]
    paths:
      - 'examples/agentic-support/**'
      - '.github/workflows/atelier-agentique.yml'
  pull_request:
    paths:
      - 'examples/agentic-support/**'
      - '.github/workflows/atelier-agentique.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atelier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: examples/agentic-support/requirements-lock.txt
      - name: Installer les versions vérifiées
        run: python -m pip install -r examples/agentic-support/requirements-lock.txt
      - name: Vérifier contrats, API, traces et reprises
        run: python -m unittest discover -s examples/agentic-support -p 'test_*.py' -v
      - name: Exécuter les trois dossiers de démonstration
        run: python examples/agentic-support/demo.py
