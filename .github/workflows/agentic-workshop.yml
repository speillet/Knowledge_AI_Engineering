name: Local agentic workshop

on:
  push:
    branches: [main]
    paths:
      - 'examples/agentic-support/**'
      - '.github/workflows/agentic-workshop.yml'
  pull_request:
    paths:
      - 'examples/agentic-support/**'
      - '.github/workflows/agentic-workshop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: examples/agentic-support/requirements-lock.txt
      - name: Install verified dependency versions
        run: python -m pip install -r examples/agentic-support/requirements-lock.txt
      - name: Check contracts, API, traces and recovery
        run: python -m unittest discover -s examples/agentic-support -p 'test_*.py' -v
      - name: Run the three demo cases
        run: python examples/agentic-support/demo.py
