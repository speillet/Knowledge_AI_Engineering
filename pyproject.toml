# Configuration of code quality tools (scripts/, tests/, examples/).
# The repository is not an installable package: no [project] section.
# Launch `make check` to replicate the CI locally.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".kilo", ".obsidian"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# "aux aux ce...".split() is more readable than a long list of empty words.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "assign_card_ids", "build_icons", "check_site", "export_anki", "lint_flashcards", "prepare_site", "sr_plugin",
    "sync_catalog",
    "api", "demo", "engine", "storage",
]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI: The dependency is declared as default.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
# Optional dependencies: genanki for the Anki export, cairosvg and Pillow for the site icons.
module = ["genanki", "cairosvg", "PIL", "PIL.*"]
ignore_missing_imports = true
