{{- /* A plain 404 page: what happened and a way back, without the theme's film quotes. */ -}}
{{ define "main" }}
  <section class="kv-notfound">
    <p>{{ i18n "error.404_error" }}</p>
    <h1>{{ i18n "error.404_title" }}</h1>
    <p>{{ i18n "error.404_description" }}</p>
    <p><a href="{{ site.Home.RelPermalink }}">{{ i18n "error.404_home" }}</a></p>
  </section>
{{ end }}
