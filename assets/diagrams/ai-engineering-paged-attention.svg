<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
<title id="title">PagedAttention</title>
<desc id="desc">Three logical KV blocks map through a block table to non-contiguous physical GPU blocks: L0 to P7, L1 to P1, L2 to P3. Logical order is independent of physical placement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215b98"/></marker></defs>
<rect width="480" height="650" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#18324b">
<text x="240" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18324b">PagedAttention</text>
<text x="240" y="98" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Logical sequence order</text>
<rect x="24" y="125" width="128" height="80" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="88.0" y="157.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">L0</text>
<text x="88.0" y="189.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Block 0</text>
<rect x="176" y="125" width="128" height="80" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="157.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">L1</text>
<text x="240.0" y="189.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Block 1</text>
<rect x="328" y="125" width="128" height="80" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="392.0" y="157.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">L2</text>
<text x="392.0" y="189.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Block 2</text>
<path d="M 240 205 V 248" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="248" width="320" height="162" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="289.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Block table</text>
<text x="240.0" y="321.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">L0 → P7</text>
<text x="240.0" y="353.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">L1 → P1</text>
<text x="240.0" y="385.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">L2 → P3</text>
<text x="240" y="459" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Physical GPU blocks</text>
<rect x="24" y="482" width="128" height="72" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="88.0" y="526.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">P1</text>
<rect x="176" y="482" width="128" height="72" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="240.0" y="526.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">P3</text>
<rect x="328" y="482" width="128" height="72" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="392.0" y="526.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">P7</text>
<text x="240" y="601" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Logical order ≠ physical order.</text>
</g>
</svg>
