<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc">
<title id="title">Prefill → decode</title>
<desc id="desc">Prefill processes A, B and C, caches their keys and values, and selects D from the logits at C. Processing D appends its KV and selects E. Processing E appends its KV and selects F.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215b98"/></marker></defs>
<rect width="480" height="760" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#18324b">
<text x="240" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18324b">Prefill → decode</text>
<rect x="24" y="98" width="432" height="140" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="144.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Prefill: process [A B C]</text>
<text x="240.0" y="176.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">KV = [A B C]</text>
<text x="240.0" y="208.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Logits at C → choose D</text>
<path d="M 240 238 V 300" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="300" width="432" height="140" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="346.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Decode: process D</text>
<text x="240.0" y="378.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">KV = [A B C D]</text>
<text x="240.0" y="410.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Logits at D → choose E</text>
<path d="M 240 440 V 502" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="502" width="432" height="140" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="548.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Decode: process E</text>
<text x="240.0" y="580.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">KV = [A B C D E]</text>
<text x="240.0" y="612.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Logits at E → choose F</text>
<text x="240" y="703" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">A chosen token enters KV</text>
<text x="240" y="737" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">only when processed.</text>
</g>
</svg>
