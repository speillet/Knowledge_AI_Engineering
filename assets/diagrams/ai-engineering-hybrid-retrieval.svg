<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
<title id="title">Hybrid retrieval</title>
<desc id="desc">A query feeds lexical and vector retrieval. RRF fuses their ranks; an optional reranker scores the merged candidates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215b98"/></marker></defs>
<rect width="480" height="660" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#18324b">
<text x="240" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18324b">Hybrid retrieval</text>
<rect x="120" y="92" width="240" height="64" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="132.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Query</text>
<path d="M 240 156 V 180 H 124 V 210" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 240 180 H 356 V 210" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="210" width="200" height="100" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="124.0" y="252.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">BM25</text>
<text x="124.0" y="284.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Exact terms</text>
<rect x="256" y="210" width="200" height="100" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="356.0" y="252.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Vectors</text>
<text x="356.0" y="284.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Similar meaning</text>
<path d="M 124 310 V 340 H 240 V 365" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 356 310 V 340 H 240" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="80" y="365" width="320" height="94" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="404.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">RRF: fuse by rank</text>
<text x="240.0" y="436.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Deduplicate candidates</text>
<path d="M 240 459 V 500" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="500" width="320" height="85" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="534.5" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Rerank candidates</text>
<text x="240.0" y="566.5" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">(optional)</text>
<text x="240" y="630" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Fuse ranks, then score pairs.</text>
</g>
</svg>
