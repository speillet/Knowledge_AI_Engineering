<svg xmlns="http://www.w3.org/2000/svg" width="480" height="672" viewBox="0 0 480 672" role="img" aria-labelledby="title desc">
<title id="title">Speculative decoding</title>
<desc id="desc">The draft proposes a, b, c and d. A target verification accepts a and b, rejects c and discards d. The emitted sequence is a, b and correction x; sampling uses the adjusted target distribution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215b98"/></marker></defs>
<rect width="480" height="672" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#18324b">
<text x="240" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18324b">Speculative decoding</text>
<text x="240" y="112" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Draft proposes a prefix</text>
<rect x="24" y="138" width="100" height="64" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="74.0" y="178.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">a</text>
<rect x="134" y="138" width="100" height="64" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="184.0" y="178.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">b</text>
<rect x="244" y="138" width="100" height="64" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="294.0" y="178.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">c</text>
<rect x="354" y="138" width="100" height="64" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="404.0" y="178.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">d</text>
<path d="M 240 202 V 224" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="240" y="259" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Target verifies together</text>
<rect x="24" y="288" width="100" height="96" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="74.0" y="328.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">a</text>
<text x="74.0" y="360.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">keep</text>
<rect x="134" y="288" width="100" height="96" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="184.0" y="328.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">b</text>
<text x="184.0" y="360.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">keep</text>
<rect x="244" y="288" width="100" height="96" rx="10" fill="#f0f2f5" stroke="#536170" stroke-width="2"/>
<text x="294.0" y="328.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">c</text>
<text x="294.0" y="360.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">reject</text>
<rect x="354" y="288" width="100" height="96" rx="10" fill="#f0f2f5" stroke="#536170" stroke-width="2"/>
<text x="404.0" y="328.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">d</text>
<text x="404.0" y="360.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">drop</text>
<text x="240" y="430" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Stop at the first rejection.</text>
<path d="M 240 444 V 482" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="482" width="432" height="86" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="517.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Emit [a b x]</text>
<text x="240.0" y="549.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">x replaces the rejected token</text>
<text x="240" y="620" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Sampling: use the adjusted</text>
<text x="240" y="652" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">target distribution for x.</text>
</g>
</svg>
