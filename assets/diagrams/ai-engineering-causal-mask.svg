<text x="240" y="102" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Rows: queries · Columns: keys</text>
<text x="181" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">K1</text>
