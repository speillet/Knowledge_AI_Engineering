<svg xmlns="http://www.w3.org/2000/svg" width="480" height="594" viewBox="0 0 480 594" role="img" aria-labelledby="title desc">
<title id="title">Causal attention mask</title>
<desc id="desc">Rows are queries and columns are keys. Query i can attend to keys 1 through i. Future positions are blocked before softmax. Query 3 sees keys 1, 2 and 3 only.</desc>
