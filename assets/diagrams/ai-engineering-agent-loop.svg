<svg xmlns="http://www.w3.org/2000/svg" width="480" height="742" viewBox="0 0 480 742" role="img" aria-labelledby="title desc">
<title id="title">Agent and tool loop</title>
<desc id="desc">The model chooses a tool request, the harness validates it, a tool executes, and the observation returns to the model. Completion or a budget limit stops the loop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#215b98"/></marker></defs>
<rect width="480" height="742" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#18324b">
<text x="240" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#18324b">Agent and tool loop</text>
<rect x="80" y="100" width="320" height="84" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="134.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Model + current state</text>
<text x="240.0" y="166.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Choose next step</text>
<path d="M 240 184 V 245" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="245" width="320" height="84" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="279.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Harness</text>
<text x="240.0" y="311.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Validate + authorize</text>
<path d="M 240 329 V 390" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="390" width="320" height="84" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="440.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Execute allowed tool</text>
<path d="M 240 474 V 535" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="535" width="320" height="84" rx="10" fill="#edf4ff" stroke="#215b98" stroke-width="2"/>
<text x="240.0" y="569.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Observe result</text>
<text x="240.0" y="601.0" text-anchor="middle" font-size="24" font-weight="400" fill="#18324b">Update context</text>
<path d="M 80 577 H 24 V 142 H 80" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="48" y="402" text-anchor="middle" font-size="24" font-weight="400" fill="#215b98" transform="rotate(-90 48 402)">continue</text>
<path d="M 400 142 H 456 V 692 H 400" fill="none" stroke="#215b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="438" y="404" text-anchor="middle" font-size="24" font-weight="400" fill="#215b98" transform="rotate(90 438 404)">done / limit reached</text>
<rect x="80" y="660" width="320" height="64" rx="10" fill="#e9f8f2" stroke="#096b57" stroke-width="2"/>
<text x="240.0" y="700.0" text-anchor="middle" font-size="24" font-weight="700" fill="#18324b">Stop / return answer</text>
</g>
</svg>
